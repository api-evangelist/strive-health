name: Strive Health
description: 'Strive Health is a Denver-based value-based kidney care company that partners
  with health systems, nephrologists, and payors to deliver comprehensive care for patients
  across the kidney disease spectrum, from chronic kidney disease (CKD) and end-stage
  kidney disease (ESKD) through dialysis and transplant. Its model combines Population
  Health care teams, Strive Care Partners (nephrologist-led services), Kidney Heroes
  nurse-practitioner care teams, and the CareMultiplier machine-learning platform for
  personalized, predictive treatment planning. Strive reports outcomes including higher
  optimal dialysis starts, reduced hospitalizations and readmissions, and increased home
  dialysis adoption. The company was surfaced as a portfolio company of NEA and Redpoint
  Ventures. As of this enrichment pass Strive Health publishes no public developer portal,
  API, or machine-readable API surface.'
